<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ЖЕСТКИЙ ЗАПРЕТ НА КЭШИРОВАНИЕ -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>ОШИБКА</title>
  
  <!-- ?v=99 заставит браузер скачать файл заново -->
  <link rel="stylesheet" href="style.css?v=99">
</head>
<body>

  <!-- Экран 1: Угроза -->
  <div id="warning-screen">
    <h1>Я ЖЕ ГОВОРИЛ<br>НЕ ЗАХОДИ СЮДА....</h1>
  </div>

  <!-- Экран 2: Уходи -->
  <div id="leave-screen" style="display: none;">
    <h2 id="leave-text">УХОДИ</h2>
  </div>

  <!-- Экран 3: Фейковый краш -->
  <div id="crash-screen" style="display: none;">
    <h1 style="color: #fff; font-size: 30px;">FATAL ERROR</h1>
    <p style="color: #ff0000; font-family: monospace;">SYSTEM CRASHED. CONNECTION LOST.</p>
  </div>

  <!-- То же самое для скрипта -->
  <script src="script.js?v=99"></script>
</body>
</html>
